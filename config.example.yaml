# CampfireSignalSearch — configuration
# Copy this file to config.yaml before running.
# Secrets (Supabase keys, email credentials) stay in environment variables
# or GitHub Actions Secrets — never commit them here.

# ── Scraper settings ──────────────────────────────────────────────────────────
scraper:
  max_age_hours: 48                 # Drop events older than this. 0 = no age filter (use while seeding DB). 24/48/72 are sensible windows for ongoing runs.
  check_interval_minutes: 240       # Daemon mode only (GitHub Actions uses cron)
  request_delay: 1.5                # Seconds between HTTP requests
  timeout: 30
  user_agent: "Mozilla/5.0 (compatible; CampfireSignalSearch/1.0)"
  min_relevance_score: 40           # 0 = keep everything. Non-tech sectors (CPG/retail/real estate/…) are filtered categorically, so this gate can stay lower to keep genuine tech leads that lack funding-size/US signals. Raise toward 50–60 to send only the strongest leads.

# ── Territory / ICP filters ───────────────────────────────────────────────────
# Campfire target: venture-backed SaaS / AI-native companies, roughly
# $20M-$300M ARR, that have outgrown QuickBooks/Xero or resent NetSuite,
# Sage Intacct, or SAP.
territory:
  country: "United States"

  company_filters:
    exclude_public_companies: true

    # Size band — Campfire ICP is $20M-$300M ARR. ARR is parsed directly from
    # press when disclosed (tech press reports it far more than CPG press
    # reports revenue); total funding raised and employee count are the
    # fallback proxies. Leads inside the band get a relevance bonus; well
    # outside it gets a penalty.
    size_band:
      arr_min_usd: 20000000            # $20M ARR
      arr_max_usd: 300000000           # $300M ARR
      funding_min_usd: 20000000        # $20M total raised (fallback proxy)
      funding_max_usd: 500000000       # $500M total raised (fallback proxy)
      employee_min: 50
      employee_max: 1500
      employee_hard_max: 3000          # > this gets a stronger penalty

    # Text patterns that indicate a publicly traded company
    public_company_indicators:
      - "nasdaq:"
      - "(nasdaq"
      - "nyse:"
      - "(nyse"
      - "otcbb:"
      - "s&p 500"
      - "fortune 500"
      - "fortune 100"

    # Already-public enterprise tech giants — filtered if mentioned anywhere
    # (too large / not VC-backed for Campfire). Deliberately uses formal
    # legal names, NOT bare product words like "SAP" or "NetSuite" — those
    # are positive stack-mention signals elsewhere, not exclusions.
    excluded_public_companies:
      - "meta platforms"
      - "alphabet inc"
      - "microsoft corporation"
      - "salesforce.com, inc"
      - "workday, inc"
      - "servicenow, inc"
      - "adobe inc"
      - "intuit inc"
      - "ibm corporation"
      - "sap se"
      - "the sage group plc"
      - "oracle corporation"
      - "snowflake inc"
      - "palantir technologies inc"

    # Large platforms — filtered ONLY when they are the SUBJECT of the
    # article. A scaling SaaS company *migrating off* NetSuite or QuickBooks,
    # or *onto* Salesforce, is exactly the signal we want, so we don't
    # blanket-exclude these names.
    excluded_mega_subjects:
      - "salesforce"
      - "hubspot"
      - "stripe"
      - "workday"
      - "servicenow"
      - "netsuite"
      - "sage intacct"
      - "quickbooks"
      - "xero"
      - "sap"
      - "microsoft dynamics"

    # Positive signals that a company is in the right size/stage band
    target_size_indicators:
      - "series b"
      - "series c"
      - "series d"
      - "growth round"
      - "growth equity"
      - "unicorn"
      - "high-growth"
      - "hypergrowth"
      - "scaling startup"
      - "venture-backed"

