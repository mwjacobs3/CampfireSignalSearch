# ── RSS feed sources ──────────────────────────────────────────────────────────
# Add / remove feeds here. category is used as a sector hint for articles
# that don't otherwise match a concrete sector keyword.
rss_feeds:
  # ── Startup / VC news (highest-signal for the Campfire ICP) ─────────────────
  - name: "TechCrunch"
    url: "https://techcrunch.com/feed/"
    event_types: ["funding", "finance_exec_hire", "erp_change_signal"]
    category: "Startup / VC News"

  - name: "VentureBeat"
    url: "https://venturebeat.com/feed/"
    event_types: ["funding", "erp_change_signal"]
    category: "Startup / VC News"

  - name: "Axios Pro Rata"
    url: "https://www.axios.com/technology/feed"
    event_types: ["funding"]
    category: "Startup / VC News"

  - name: "Inc. — Startups"
    url: "https://www.inc.com/rss/startup.xml"
    event_types: ["funding", "finance_exec_hire"]
    category: "Startup / VC News"

  - name: "Fortune Term Sheet"
    url: "https://fortune.com/feed/fortune-term-sheet/"
    event_types: ["funding"]
    category: "Startup / VC News"

  # ── AI / SaaS / Fintech trade press ─────────────────────────────────────────
  - name: "SaaStr Blog"
    url: "https://www.saastr.com/feed/"
    event_types: ["funding", "erp_change_signal", "compliance_signal"]
    category: "SaaS / Enterprise Software"

  - name: "The SaaS News"
    url: "https://thesaasnews.com/feed/"
    event_types: ["funding", "finance_exec_hire"]
    category: "SaaS / Enterprise Software"

  # ── Vertical SaaS: Digital Health / HealthTech ──────────────────────────────
  # Fierce Healthcare is healthcare-industry trade press; most of it (hospitals,
  # payers, policy) is outside the ICP. Scoped to funding + finance-exec-hire so
  # the relevance gate keeps the ICP slice: venture-backed digital-health / SaaS
  # startups raising growth rounds and hiring finance leadership.
