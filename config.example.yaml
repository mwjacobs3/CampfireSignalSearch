    - "venture-backed startup uses Ramp and Rippling"

  # Sector-specific funding queries — the news scraper auto-classifies each
  # result against the keyword sets in `keywords:` above, so an article that
  # doesn't say "Series B" verbatim can still route correctly.
  ai_ml:
    - "AI agent startup raises funding"
    - "generative AI startup Series B"
    - "AI copilot company raises Series C"
    - "machine learning platform raises growth round"
    - "foundation model company raises funding"

  fintech:
