    - "data infrastructure startup raises funding"

  cybersecurity:
    - "cybersecurity startup raises Series B"
    - "identity security company raises Series C"
    - "threat detection startup raises funding"

# ── Website-stack enrichment ──────────────────────────────────────────────────
# After dedup we fetch each lead's company website and inspect the homepage
# HTML for tech-stack tells (Stripe Checkout, HubSpot tracking, Vanta/Drata
# trust badges, Greenhouse/Lever careers embeds, etc.). Any hit is merged
# into `tech_stack` and re-evaluated against INTEGRATION_KEYWORDS so
# `integration_match` reflects the true stack rather than just press copy.
# Best-effort — any fetch failure is silent.
enrichment:
  enabled: true
  timeout_seconds: 6   # per-domain HTTP timeout

# ── Email alerts ──────────────────────────────────────────────────────────────
# Credentials are injected from environment variables at runtime.
# Set these in your .env or GitHub Actions Secrets.
alerts:
  email:
    enabled: true
    smtp_host: ""       # overridden by SMTP_HOST env var
    smtp_port: 587      # overridden by SMTP_PORT env var
    sender_email: ""    # overridden by EMAIL_SENDER env var
    sender_password: "" # overridden by EMAIL_PASSWORD env var
    recipient_emails: []# overridden by EMAIL_RECIPIENTS env var (comma-separated)
