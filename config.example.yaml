  - name: "CFO Brew"
    url: "https://www.cfobrew.com/feed"
    event_types: ["finance_exec_hire", "erp_change_signal"]
    category: "Finance & Accounting Press"

  # ── Press Releases (broad) ───────────────────────────────────────────────────
  - name: "BusinessWire — Technology"
    url: "https://feed.businesswire.com/rss/home/?rss=G9"
    event_types: ["funding", "finance_exec_hire", "erp_change_signal", "compliance_signal"]
    category: "Press Releases"

  - name: "PR Newswire — Technology"
    url: "https://www.prnewswire.com/rss/technology-latest-news.rss"
