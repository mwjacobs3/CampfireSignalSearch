    url: "https://www.fiercehealthcare.com/rss/xml"
    event_types: ["funding", "finance_exec_hire"]
    category: "Healthcare / Digital Health"

  # ── CFO / Finance / Accounting press (where CFO-side triggers actually break) ─
  - name: "CFO Dive"
    url: "https://www.cfodive.com/feeds/news/"
    event_types: ["finance_exec_hire", "erp_change_signal", "compliance_signal"]
    category: "Finance & Accounting Press"

  - name: "Accounting Today"
    url: "https://www.accountingtoday.com/feed"
