    - "SaaS company Series C funding"
    - "AI startup Series B funding round"
    - "AI startup Series C funding round"
    - "AI-native company raises Series B"
    - "fintech startup Series B funding"
    - "cybersecurity startup Series B raises"
    - "developer tools startup raises Series B"
    - "vertical SaaS company raises Series C"
    - "enterprise software startup raises growth round"
    - "B2B SaaS company raises funding round"
    - "venture-backed software company Series C"
    - "startup crosses $50 million ARR"
    - "startup crosses $100 million ARR"
    - "SaaS company surpasses $100 million ARR"
    - "AI company raises growth equity round"
    - "software startup raises Series D"
    - "tech company announces Series C funding"
    - "high-growth SaaS company raises funding"
    - "unicorn SaaS startup raises funding"

  finance_exec_hire:
    - '"names" "chief financial officer" SaaS company'
    - '"appoints" "chief financial officer" startup'
    - '"hires" "CFO" venture-backed startup'
    - '"welcomes" "CFO" tech company'
    - '"names" "VP of Finance" SaaS company'
    - '"appoints" "VP Finance" tech startup'
    - '"names" "Chief Accounting Officer" software company'
    - '"appoints" "Controller" venture-backed startup'
    - '"names" "Head of Finance" tech startup'
    - '"appoints" "Head of FP&A" SaaS company'
    - "SaaS startup hires first CFO"
    - "tech company names new CFO"
    - "AI startup appoints chief financial officer"
    - "venture-backed startup hires VP finance"
    - "software company promotes controller to CFO"

  erp_change_signal:
    - '"outgrew QuickBooks" startup'
    - '"outgrowing QuickBooks" SaaS company'
    - '"replacing QuickBooks" tech startup'
    - '"migrating off QuickBooks" software company'
    - '"outgrew Xero" startup'
    - '"replacing Xero" SaaS company'
    - '"implementing NetSuite" tech startup'
    - '"NetSuite implementation" SaaS company'
    - '"migrating to NetSuite" software startup'
    - '"ripping out NetSuite" tech company'
    - '"selects NetSuite" venture-backed startup'
    - '"implementing Sage Intacct" SaaS company'
    - '"Sage Intacct implementation" tech startup'
    - "startup selects new ERP system"
    - "SaaS company evaluates new general ledger"
    - "tech company ERP migration project"
    - "finance team rips out spreadsheets ERP"
    - "startup replaces legacy ERP system"

  compliance_signal:
    - '"SOC 2 Type II" SaaS company'
    - '"achieves SOC 2" tech startup'
    - '"completes SOC 2 audit" software company'
    - "SaaS startup files confidentially for IPO"
    - "tech company files S-1"
    - "software startup prepares for IPO"
    - "venture-backed startup first annual audit"
    - "SaaS company audit-ready financials"
    - "tech startup investor-ready reporting"
    - "software company board-ready financials"

  # Stack-footprint queries — surface companies that name a legacy/entry
  # accounting system or a modern finance/RevOps tool in their press. These
  # are the strongest "current stack" signals we can mine from articles.
  stack_footprint:
    - '"runs on NetSuite" tech company'
