# Ruff config for CampfireSignalSearch.
# Kept intentionally lean: the default rule set (pyflakes + a curated slice of
# pycodestyle) catches real bugs — undefined names, unused imports, ambiguous
# identifiers — without drowning the project in style noise.
target-version = "py311"
line-length = 100

[lint]
# Explicit selection so the check is deterministic across ruff versions — newer
# ruff releases widen the default rule set, which would otherwise fail CI on
# pre-existing style the project never opted into. E (pycodestyle) + F
# (pyflakes) catch the real bugs: syntax errors, undefined names, unused
# imports. E501 (line length) is ignored — the scrapers have long strings/prints.
select = ["E", "F"]
ignore = ["E501"]
